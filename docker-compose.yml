services:
  dashboard:
    build: .
    container_name: dive-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Persiste sessões, cache e backups entre restarts
      - ./storage:/app/storage
      # Configurações (members.json, teams.json, scoring-config.json) e
      # dashboard-drive-data.json (opcional, gerado pelo script de coleta do Drive).
      # Não montar dashboard-drive-data.json como arquivo isolado: se ele não existir,
      # o Docker cria uma PASTA com esse nome e a coleta quebra.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
